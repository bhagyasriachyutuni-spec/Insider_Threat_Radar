{% extends 'base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

        <h3 class="text-center mb-2" style="font-weight: 600; color: #333;">
            Reset Password
        </h3>

        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            Verify your identity to create a new password
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">User ID</label>
                <input name="id"
                       placeholder="Enter your User ID"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input name="email"
                       placeholder="Enter your Email"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <div class="mb-3">
                <label class="form-label">Security Answer</label>
                <input name="answer"
                       placeholder="Your answer"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input name="new_password"
                       type="password"
                       placeholder="Enter new password"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <button class="btn w-100 mt-3"
                    style="background: linear-gradient(90deg, #ff9800, #ff5722);
                           color: white;
                           border-radius: 25px;
                           padding: 10px;
                           font-weight: 500;
                           border: none;">
                🔄 Reset Password
            </button>

        </form>

        <p class="text-center mt-3" style="font-size: 13px; color: #999;">
            Make sure your details are correct
        </p>

    </div>

</div>

{% endblock %}
