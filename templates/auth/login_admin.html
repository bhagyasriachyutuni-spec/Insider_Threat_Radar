{% extends 'base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="card shadow-lg p-4" style="width: 400px; border-radius: 15px;">

        <h3 class="text-center mb-2" style="font-weight: 600; color: #333;">
            Admin Panel
        </h3>

        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            Secure access for system administrators
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Admin ID</label>
                <input name="id"
                       placeholder="Enter Admin ID"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input name="password"
                       type="password"
                       placeholder="Enter Password"
                       class="form-control rounded-pill px-3 py-2">
            </div>

            <button class="btn w-100 mt-3"
                    style="background: linear-gradient(90deg, #ff416c, #ff4b2b);
                           color: white;
                           border-radius: 25px;
                           padding: 10px;
                           font-weight: 500;
                           border: none;">
                🔐 Admin Login
            </button>

        </form>

        <p class="text-center mt-3" style="font-size: 13px; color: #999;">
            Restricted access • Authorized personnel only
        </p>

    </div>

</div>

{% endblock %}
