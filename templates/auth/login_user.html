{% extends 'base.html' %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">

    <div class="card shadow-lg p-4" style="width: 420px; border-radius: 15px;">

        <h3 class="text-center mb-2" style="font-weight: 600; color: #333;">
            Welcome Back
        </h3>

        <p class="text-center text-muted mb-4" style="font-size: 14px;">
            Login to continue to Threat Detection System
        </p>

        <!-- ✅ FORM -->
        <form method="POST" onsubmit="return savePattern()">

            <!-- USER ID -->
            <div class="mb-3">
                <label class="form-label">User ID</label>
                <input name="id"
                       placeholder="Enter User ID"
                       class="form-control rounded-pill px-3 py-2"
                       required>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password"
                       name="password"
                       type="password"
                       placeholder="Enter Password"
                       class="form-control rounded-pill px-3 py-2"
                       required>
            </div>

            <!-- ✅ HIDDEN PATTERN FIELD -->
            <input type="hidden" name="pattern" id="pattern">

            <!-- BUTTON -->
            <button type="submit"
                    class="btn w-100 mt-3"
                    style="background: linear-gradient(90deg, #007bff, #6610f2);
                           color: white;
                           border-radius: 25px;
                           padding: 10px;
                           font-weight: 500;
                           border: none;">
                Login
            </button>

            <!-- FORGOT PASSWORD -->
            <a href="/forgot_password"
               class="d-block text-center mt-3"
               style="font-size: 14px; color: #6c757d;">
               Forgot Password?
            </a>

        </form>

    </div>

</div>

<!-- ================= JS ================= -->

<script>

let keyDownTime = {};
let holdTimes = [];
let gapTimes = [];
let lastKeyTime = null;

const passwordField = document.getElementById("password");

// ✅ KEY DOWN EVENT
passwordField.addEventListener("keydown", function(e) {
    const now = performance.now();

    keyDownTime[e.code] = now;

    if (lastKeyTime !== null) {
        gapTimes.push(now - lastKeyTime);
    }
});

// ✅ KEY UP EVENT
passwordField.addEventListener("keyup", function(e) {
    const now = performance.now();

    if (keyDownTime[e.code] !== undefined) {
        holdTimes.push(now - keyDownTime[e.code]);
    }

    lastKeyTime = now;
});

// ✅ RESET DATA IF USER CLEARS INPUT
passwordField.addEventListener("input", function(e) {
    if (e.target.value.length === 0) {
        resetPattern();
    }
});

// ✅ RESET FUNCTION
function resetPattern() {
    keyDownTime = {};
    holdTimes = [];
    gapTimes = [];
    lastKeyTime = null;
}

// ✅ SAVE PATTERN BEFORE SUBMIT
function savePattern() {

    // Prevent empty pattern issue
    if (holdTimes.length === 0 || gapTimes.length === 0) {
        document.getElementById("pattern").value = "";
        return true;
    }

    const pattern = {
        hold: holdTimes,
        gap: gapTimes
    };

    document.getElementById("pattern").value = JSON.stringify(pattern);

    return true; // allow form submit
}

</script>

{% endblock %}
