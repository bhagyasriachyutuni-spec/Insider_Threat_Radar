<!DOCTYPE html>
<html>
<head>
    <title>Threat Detection System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
        }

        /* NAVBAR */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 14px 0;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 18px;
            color: #111827 !important;
        }

        .nav-link {
            color: #374151 !important;
            font-weight: 500;
            margin-left: 18px;
            transition: 0.2s;
        }

        .nav-link:hover {
            color: #2563eb !important;
        }

        /* BUTTONS */
        .btn-primary-custom {
            background: #2563eb;
            color: white;
            border-radius: 8px;
            padding: 6px 14px;
            border: none;
        }

        .btn-primary-custom:hover {
            background: #1e4fd1;
        }

        .btn-outline-custom {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 14px;
            background: white;
        }

        .btn-outline-custom:hover {
            background: #f9fafb;
        }

        /* MAIN CARD */
        .container-box {
            background: white;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        h3 {
            font-weight: 600;
            color: #111827;
        }

        /* TABLE */
        .table {
            border-radius: 10px;
            overflow: hidden;
        }

        /* BADGE */
        .badge {
            border-radius: 6px;
            font-size: 12px;
        }

        /* SMALL UI IMPROVEMENTS */
        .section-title {
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .card-clean {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 16px;
            background: #ffffff;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand" href="/">Threat Detection</a>

        <!-- TOGGLER -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse justify-content-end" id="navMenu">

            <!-- ADMIN -->
            {% if session.get('admin_id') %}
                <a href="/admin/dashboard" class="nav-link">Dashboard</a>
                <a href="/admin/activities" class="nav-link">Activities</a>
                <a href="/logout" class="btn btn-primary-custom ms-3">Logout</a>

            <!-- USER -->
            {% elif session.get('user_id') %}
                <a href="/user/dashboard" class="nav-link">Dashboard</a>
                <a href="/user/prediction" class="nav-link">Prediction</a>
                <a href="/user/history" class="nav-link">History</a>

                <!-- ✅ NEW FEATURE -->
                <a href="/send_email" class="nav-link">Send Email</a>

                <a href="/logout" class="btn btn-primary-custom ms-3">Logout</a>

            <!-- PUBLIC -->
            {% else %}
                <a href="/login_user" class="nav-link">Login</a>
                <a href="/register" class="btn btn-outline-custom ms-2">Register</a>
                <a href="/login_admin" class="btn btn-primary-custom ms-2">Admin</a>
            {% endif %}

        </div>

    </div>
</nav>

<div class="container mt-4">
    <div class="container-box">
        {% block content %}{% endblock %}
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
